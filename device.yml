%YAML 1.1
---
# Schema: stay on draft-02. Checked 2026-09-22 with harp.toolkit 0.3.0.
# The schema files in harp-tech/protocol declare $id draft-03, but the docs
# site publishes them under draft-02, so the draft-03 URL returns 404.
# draft-03 also requires protocolVersion, which the 0.3.0 generator rejects
# as an unknown property. So draft-02 is the only combination that both
# validates and generates today.
# yaml-language-server: $schema=https://harp-tech.org/draft-02/schema/device.json
device: VertiGate
whoAmI: 3002
firmwareVersion: "0.1"
hardwareTargets: "0.1"
registers:
  Control:
    address: 32
    access: Write
    type: U8
    maskType: ControlFlags
    description: >-
      Commands for the gate. Each bit is one command. Writing a bit runs the
      command. The register stores no state. A write with both bits of a pair
      set is rejected with an error reply.
  TargetPosition:
    address: 33
    access: Write
    type: U8
    minValue: 0
    maxValue: 255
    description: >-
      Target position of the gate. 0 lowers the gate fully down, 255 raises it
      fully up, and any value in between moves the gate to the matching
      position. One count is 1.2 mm.
  GateState:
    address: 34
    access: Event
    type: U8
    maskType: GateStatus
    description: Reports the current state of the gate.
  Speed:
    address: 35
    access: Write
    type: U8
    minValue: 0
    maxValue: 255
    defaultValue: 255
    volatile: false
    description: >-
      Movement speed of the gate, mapped onto the Dynamixel profile velocity.
      One count is 0.38 mm/s.
  Torque:
    address: 36
    access: Write
    type: U8
    minValue: 0
    maxValue: 127
    defaultValue: 35
    volatile: false
    description: >-
      Torque limit applied to the gate motor, as a servo current limit. Values
      are masked to the lower 7 bits. One count is 0.36 kgf·mm. Writing this
      register switches the motor off and on, so the gate drops for a moment if
      it is holding a position. It leaves the motor off if MotorState is
      Disabled.
  CalibrationOffset:
    address: 37
    access: Write
    type: S8
    minValue: -128
    maxValue: 127
    defaultValue: 0
    volatile: false
    description: >-
      Offset applied to the fully-raised position, to trim the end stop without
      moving hardware. One count is one encoder count, 25 µm.
  MotorState:
    address: 38
    access: Event
    type: U8
    maskType: MotorStatus
    description: Reports whether the motor holds the gate. DisableMotor and EnableMotor set it.
bitMasks:
  ControlFlags:
    description: Commands accepted by the Control register.
    bits:
      EnableMotor: {value: 0x01, description: Turn the motor torque on. The gate holds its position.}
      DisableMotor: {value: 0x02, description: Turn the motor torque off. The gate can be moved by hand.}
      Stop: {value: 0x04, description: Stop the current movement and hold the position.}
      Calibrate: {value: 0x08, description: Move the gate to the lower end stop and record it as home.}
      EnablePositionEvent: {value: 0x10, description: Start sending Position events.}
      DisablePositionEvent: {value: 0x20, description: Stop sending Position events.}
      EnableTelemetryEvent: {value: 0x40, description: Start sending ServoTelemetry events.}
      DisableTelemetryEvent: {value: 0x80, description: Stop sending ServoTelemetry events.}
groupMasks:
  MotorStatus:
    description: Enumerates the states of the gate motor.
    values:
      Disabled: {value: 0, description: The motor is off. The gate refuses to move until the motor is enabled.}
      Enabled: {value: 1, description: The motor is on and holds the gate.}
  GateStatus:
    description: Enumerates the possible states of the gate.
    values:
      Idle: {value: 0, description: The gate is stationary and not at a known end stop.}
      Up: {value: 1, description: The gate is fully raised up.}
      Down: {value: 2, description: The gate is fully lowered down.}
      Moving: {value: 3, description: The gate is moving towards a target position.}
      Calibrating: {value: 4, description: The gate is moving to the lower end stop to find home.}
      Error: {value: 0xFF, description: The last movement or calibration failed.}
