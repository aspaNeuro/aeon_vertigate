[project]
name = "aeon-vertigate"
version = "0.1.0"
description = "Host tools for the VertiGate Harp device: flashing, testing and the Python interface."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mpremote>=1.24",
  "pyserial>=3.5",
]

[project.optional-dependencies]
harp = [
  "harp-python>=0.3.0",
]

[project.scripts]
vertigate-test = "aeon.vertigate.hwtest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeon"]

[tool.ruff]
line-length = 108
